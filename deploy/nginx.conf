server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 1m;
 location /api/ { proxy_pass http://127.0.0.1:8080/api/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_connect_timeout 10s; proxy_read_timeout 100s; }
 location /actuator/ { proxy_pass http://127.0.0.1:8080/actuator/; proxy_set_header Host $host; }
 location /swagger-ui/ { proxy_pass http://127.0.0.1:8080/swagger-ui/; }
 location /swagger-ui.html { proxy_pass http://127.0.0.1:8080/swagger-ui.html; }
 location /v3/api-docs { proxy_pass http://127.0.0.1:8080/v3/api-docs; }
 location / { try_files $uri $uri/ /index.html; }
}
